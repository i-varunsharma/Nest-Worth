<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F7F4EF" />
    <meta
      name="description"
      content="Nestworth reads your whole household before it tells you what to spend, save and invest. Built for how Indian families actually share money."
    />
    <!--
      The fonts.

      These used to be pulled in with an @import at the top of global.css, which
      works but is the slowest way to do it. A CSS @import is only discovered
      after the stylesheet itself has downloaded and been parsed, so the browser
      waits for our CSS, then asks Google for more CSS, then asks for the font
      files: three trips, one after another, before any heading can be drawn.

      Asking for it here means the browser sees the request while it is still
      reading the HTML and fetches it alongside everything else. The two
      preconnect lines warm up the connection before the request is even made.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&family=Instrument+Serif:ital@0;1&display=swap"
    />
    <title>Nestworth — your net worth was never just yours</title>

    <!--
      Google's sign-in library.

      It has to be a plain script tag here rather than an npm package, because
      Google only publishes it from their own address and expects to load it
      from there. Once it arrives it puts a "google" object on the window, which
      GoogleButton.jsx waits for and then uses.

      async  fetch it alongside the page instead of blocking it
      defer  run it after the page has been parsed
    -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!--
      The theme, applied before anything is drawn.

      This has to be a plain script here rather than React code, and it has to
      run before the <body> below. If we waited for React, the browser would
      paint the cream page first and then repaint it black a moment later, and
      that white flash is the single most noticeable bug a dark mode can have.

      It repeats the small rule in src/hooks/useTheme.js on purpose: a saved
      choice wins, and somebody who has never chosen gets what their computer
      is set to.
    -->
    <script>
      (function () {
        var saved = localStorage.getItem('nestworth-theme');
        var theme = saved;

        if (theme !== 'dark' && theme !== 'light') {
          if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            theme = 'dark';
          } else {
            theme = 'light';
          }
        }

        document.documentElement.setAttribute('data-theme', theme);

        if (theme === 'dark') {
          document.documentElement.style.colorScheme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
